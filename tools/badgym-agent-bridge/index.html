<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAD GYM - Agent Supervisor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --warning: #eab308;
            --error: #ef4444;
            --border: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
            overflow-y: auto;
        }
        header {
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .container {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .left-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }
        .right-col {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .panel h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 10px;
        }
        .stat-label {
            color: var(--text-dim);
            font-weight: bold;
        }
        .stat-val {
            font-family: monospace;
            font-size: 1.1rem;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            background-color: #333;
        }
        .status-running { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
        .status-waiting { background-color: rgba(234, 179, 8, 0.2); color: var(--warning); }
        .status-syncing { background-color: rgba(56, 189, 248, 0.2); color: var(--accent); }
        .status-error { background-color: rgba(239, 68, 68, 0.2); color: var(--error); }
        
        #log-container, #diff-container {
            flex: 1;
            background-color: #000;
            color: #fff;
            font-family: monospace;
            padding: 10px;
            overflow-y: auto;
            border-radius: 4px;
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: pre-wrap;
            min-height: 150px;
        }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .log-time { color: var(--text-dim); margin-right: 10px; }
        .log-phase { color: var(--accent); margin-right: 10px; }
        .health-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <header>
        BAD GYM — AUTONOMOUS AGENT CENTER
    </header>
    
    <div class="container">
        <div class="left-col">
            <div class="panel">
                <h2>STATE</h2>
                <div class="stat-grid">
                    <div class="stat-label">STATUS</div>
                    <div class="stat-val" id="val-status">-</div>
                    
                    <div class="stat-label">TASK</div>
                    <div class="stat-val" id="val-task">-</div>
                    
                    <div class="stat-label">MODEL</div>
                    <div class="stat-val" id="val-model">-</div>
                    
                    <div class="stat-label">BRANCH</div>
                    <div class="stat-val" id="val-branch">-</div>
                    
                    <div class="stat-label">PID</div>
                    <div class="stat-val" id="val-pid">-</div>
                    
                    <div class="stat-label">ELAPSED</div>
                    <div class="stat-val" id="val-elapsed">-</div>
                    
                    <div class="stat-label">PHASE</div>
                    <div class="stat-val" id="val-phase" style="color: var(--accent)">-</div>
                </div>
            </div>
            
            <div class="panel">
                <h2>SYSTEM HEALTH</h2>
                <div class="health-item">
                    <span>AGY Process</span>
                    <span id="health-agy">⚪</span>
                </div>
                <div class="health-item">
                    <span>Last Event</span>
                    <span id="health-last-event">-</span>
                </div>
                <div class="health-item">
                    <span>Dashboard Data</span>
                    <span id="health-dash">🟢 Connected</span>
                </div>
            </div>
            
            <div class="panel" style="flex: 1; display: flex; flex-direction: column;">
                <h2>FILE CHANGES (git diff)</h2>
                <div id="diff-container">-</div>
            </div>
        </div>
        
        <div class="right-col">
            <div class="panel" style="flex: 1;">
                <h2>LIVE ACTIVITY</h2>
                <div id="log-container"></div>
            </div>
        </div>
    </div>

    <script>
        function formatTime(seconds) {
            if (!seconds) return "-";
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }
        
        function getStatusClass(status) {
            if (!status) return "";
            status = status.toUpperCase();
            if (status.includes("RUNNING") || status.includes("COMPLETED")) return "status-running";
            if (status.includes("WAITING")) return "status-waiting";
            if (status.includes("SYNCING")) return "status-syncing";
            if (status.includes("ERROR") || status.includes("STUCK") || status.includes("EXIT") || status.includes("FAIL") || status.includes("BLOCKED")) return "status-error";
            return "";
        }

        async function updateDashboard() {
            try {
                const res = await fetch('agent-state.json?t=' + new Date().getTime());
                if (res.ok) {
                    const state = await res.json();
                    
                    const statusEl = document.getElementById('val-status');
                    statusEl.textContent = state.status || '-';
                    statusEl.className = 'stat-val status-badge ' + getStatusClass(state.status);
                    
                    document.getElementById('val-task').textContent = state.task || '-';
                    document.getElementById('val-model').textContent = state.model || '-';
                    document.getElementById('val-branch').textContent = state.branch || '-';
                    document.getElementById('val-pid').textContent = state.pid || '-';
                    document.getElementById('val-elapsed').textContent = formatTime(state.elapsedSeconds);
                    document.getElementById('val-phase').textContent = state.phase || '-';
                    
                    if (state.lastEventTime) {
                        const lastTime = new Date(state.lastEventTime);
                        const diff = Math.floor((new Date() - lastTime) / 1000);
                        document.getElementById('health-last-event').textContent = `${diff} sec ago`;
                    }
                    
                    document.getElementById('health-agy').textContent = state.pid ? '🟢 Running' : '⚪ Stopped';
                    document.getElementById('health-dash').textContent = '🟢 Connected';
                    
                    if (state.diffStat) {
                        document.getElementById('diff-container').textContent = state.diffStat;
                    } else {
                        document.getElementById('diff-container').textContent = "No file changes detected.";
                    }
                }
            } catch (e) {
                document.getElementById('health-dash').textContent = '🔴 Disconnected';
            }
            
            try {
                const res = await fetch('agent-events.jsonl?t=' + new Date().getTime());
                if (res.ok) {
                    const text = await res.text();
                    const lines = text.trim().split('\n');
                    const logContainer = document.getElementById('log-container');
                    logContainer.innerHTML = '';
                    
                    // Show last 100 events
                    const showLines = lines.slice(-100);
                    showLines.forEach(line => {
                        if (!line) return;
                        try {
                            const evt = JSON.parse(line);
                            const time = new Date(evt.timestamp).toLocaleTimeString();
                            const div = document.createElement('div');
                            div.className = 'log-entry';
                            div.innerHTML = `<span class="log-time">[${time}]</span><span class="log-phase">${evt.phase}</span> <span>${evt.message}</span>`;
                            logContainer.appendChild(div);
                        } catch(e) {}
                    });
                    logContainer.scrollTop = logContainer.scrollHeight;
                }
            } catch (e) {}
        }

        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
