name: Android Build

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build and unit test
        run: ./gradlew clean testDebugUnitTest assembleDebug
