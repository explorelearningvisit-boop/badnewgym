name: Flutter CI

on:
  push:
    branches: [migration/flutter-cross-platform]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    branches: [migration/flutter-cross-platform]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-ci.yml"

permissions:
  contents: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name bad_gym .
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: flutter --version
      - run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Commit formatter changes when needed
        working-directory: .
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter_app/lib flutter_app/test
          if ! git diff --cached --quiet; then
            git commit -m "Apply Dart formatter"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  ios-simulator-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --project-name bad_gym .
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign
